<style>
  .cbe-report-options-dialog {
    max-width: 440px;
  }

  .cbe-report-options-modal {
    border: 1px solid #edf0f2;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
  }

  .cbe-report-options-header {
    padding: 1rem 1.1rem 0.55rem;
    border-bottom: 0;
    background: #ff7979;
  }

  .cbe-report-options-header .modal-title,
  .cbe-report-options-header .modal-title i {
    color: #fff;
    font-size: 0.95rem;
    font-weight: 700;
  }

  .cbe-report-options-body {
    padding: 0.85rem 1.1rem 0.35rem;
  }

  .cbe-report-options-copy {
    margin: 0 0 0.85rem;
    font-size: 0.8rem;
    color: #6b7280;
  }

  .cbe-report-options-fieldset {
    margin: 0 0 1rem;
    padding: 0;
    border: 0;
  }

  .cbe-report-options-legend {
    display: block;
    margin-bottom: 0.45rem;
    font-size: 0.78rem;
    font-weight: 700;
    color: #374151;
  }

  .cbe-report-options-choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
  }

  .cbe-report-options-choice {
    display: flex;
    align-items: flex-start;
    gap: 0.45rem;
    margin: 0;
    padding: 0.65rem 0.7rem;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    background: #f8fafc;
    cursor: pointer;
  }

  .cbe-report-options-choice.is-selected {
    border-color: rgba(255, 121, 121, 0.55);
    background: #fff5f5;
  }

  .cbe-report-options-choice span {
    font-size: 0.78rem;
    font-weight: 600;
    color: #1f2937;
    line-height: 1.3;
  }

  .cbe-report-options-choice small {
    display: block;
    margin-top: 0.15rem;
    font-size: 0.68rem;
    font-weight: 400;
    color: #6b7280;
  }

  .cbe-report-options-date {
    margin-top: 0.55rem;
  }

  .cbe-report-options-date .form-label {
    margin-bottom: 0.3rem;
    font-size: 0.76rem;
    font-weight: 600;
    color: #495057;
  }

  .cbe-report-options-error {
    margin: 0 0 0.75rem;
    font-size: 0.76rem;
    color: #b42318;
  }

  .cbe-report-options-footer {
    padding: 0 1.1rem 1rem;
    border-top: 0;
    gap: 0.5rem;
  }

  .cbe-report-options-confirm {
    min-width: 88px;
    border: 1px solid #ff7979;
    border-radius: 8px;
    background: #ff7979;
    color: #fff;
    font-size: 0.82rem;
    font-weight: 600;
  }

  .cbe-report-options-confirm:hover,
  .cbe-report-options-confirm:focus {
    background: #f56868;
    border-color: #f56868;
    color: #fff;
  }
</style>

<div
  class="modal fade"
  id="cbeReportOptionsModal"
  tabindex="-1"
  aria-labelledby="cbeReportOptionsModalLabel"
  aria-hidden="true"
  data-bs-backdrop="static"
  data-bs-keyboard="false"
>
  <div class="modal-dialog modal-dialog-centered cbe-report-options-dialog">
    <div class="modal-content cbe-report-options-modal">
      <div class="modal-header cbe-report-options-header">
        <h6 class="modal-title" id="cbeReportOptionsModalLabel">
          <i class="bi bi-file-earmark-pdf me-2"></i>Report card options
        </h6>
        <button
          type="button"
          class="btn-close btn-close-white"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>

      <div class="modal-body cbe-report-options-body">
        <p class="cbe-report-options-copy">
          These choices apply only on the current report card(s) generation.
        </p>

        <fieldset class="cbe-report-options-fieldset">
          <legend class="cbe-report-options-legend">Include ranking?</legend>
          <div class="cbe-report-options-choices">
            <label class="cbe-report-options-choice">
              <input
                type="radio"
                name="cbeIncludeRanking"
                id="cbeIncludeRankingYes"
                value="yes"
                checked
              />
              <span>
                Yes
                <small>Show class and stream position</small>
              </span>
            </label>
            <label class="cbe-report-options-choice">
              <input
                type="radio"
                name="cbeIncludeRanking"
                id="cbeIncludeRankingNo"
                value="no"
              />
              <span>
                No
                <small>Print without positions</small>
                <small>CBE Recommended</small>
              </span>
            </label>
          </div>
        </fieldset>

        <fieldset class="cbe-report-options-fieldset">
          <legend class="cbe-report-options-legend">School opening date</legend>
          <label class="cbe-report-options-choice">
            <input type="checkbox" id="cbeIncludeOpeningDate" />
            <span>
              Include opening date
              <small>Print “School opens on …” on the assessment report</small>
            </span>
          </label>
          <div class="cbe-report-options-date">
            <label class="form-label" for="cbeOpeningDate">Opening date</label>
            <input
              type="date"
              class="form-control form-control-sm"
              id="cbeOpeningDate"
              disabled
            />
          </div>
        </fieldset>

        <p id="cbeReportOptionsError" class="cbe-report-options-error d-none" role="alert"></p>
      </div>

      <div class="modal-footer cbe-report-options-footer">
        <button
          type="button"
          class="btn btn-sm btn-light"
          data-bs-dismiss="modal"
        >
          Cancel
        </button>
        <button
          type="button"
          class="btn btn-sm cbe-report-options-confirm"
          id="cbeReportOptionsConfirm"
        >
          Generate PDF
        </button>
      </div>
    </div>
  </div>
</div>
